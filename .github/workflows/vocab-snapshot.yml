# Builds the weekly vocabulary snapshots and force-pushes them to the
# vocab-data branch, which clients download instead of querying the wiki.
# A dataset below the tool's minimum record count fails the job; clients
# keep the previous snapshot.
name: vocab-snapshot

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build snapshots
        run: ./gradlew vocabSnapshot -PsnapshotPaceSeconds=20 --console=plain

      - name: Publish to vocab-data branch
        run: |
          cd build/vocab
          git init -b vocab-data
          git config user.name "vocab-snapshot[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "vocab snapshot $(date -u +%Y-%m-%d)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin vocab-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
