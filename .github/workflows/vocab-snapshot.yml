# Weekly vocabulary snapshot: runs the wiki's bulk queries once and
# publishes gzipped snapshots to the vocab-data branch, which clients
# download from GitHub's CDN instead of querying the wiki themselves.
#
# The snapshot tool refuses to emit a dataset below its minimum record
# count, so a wiki API change fails this job rather than publishing a
# broken snapshot; clients keep the previous one.
#
# The weekly force-push counts as repository activity, which keeps GitHub
# from suspending the schedule under its 60-day idle rule.
name: vocab-snapshot

on:
  schedule:
    # Tuesday 03:17 UTC; off-hour minute because top-of-the-hour crons
    # are GitHub's busiest scheduler slot.
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: gradle/actions/setup-gradle@v4

      # ~50 wiki requests spread 20s apart instead of bursting; nothing
      # here is latency-sensitive. Local runs default to full speed.
      - name: Build snapshots
        run: ./gradlew vocabSnapshot -PsnapshotPaceSeconds=20 --console=plain

      - name: Publish to vocab-data branch
        run: |
          cd build/vocab
          git init -b vocab-data
          git config user.name "vocab-snapshot[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "vocab snapshot $(date -u +%Y-%m-%d)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch is a publishing slot, not history: one commit,
          # force-pushed.
          git push --force origin vocab-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
